[package]
name = "avenix"
version = "0.27.0"
edition = "2024"
description = "A concurrent ECS application framework"
readme = "README.md"
repository = "https://github.com/ArjitSinghLodhi/avenix"
license = "MIT OR Apache-2.0"
keywords = ["ecs", "archetype", "framework", "parallel", "concurrency"]
categories = ["development-tools"]

[dependencies]
avenix_macros = "0.9.0"
indexmap = "2.14.2"
rayon = "1.12.0"
orx-concurrent-bag = "4.0.1"
parking_lot = "0.12.5"
dashmap = { version = "6.2.1", default-features = false, features = ["raw-api", "inline"]}
rustc-hash = "2.1.3"
orx-parallel = { version = "4.1.1", features = ["rayon-core"] }

[dev-dependencies]
criterion = "0.8.2"
test-fork = "0.1.7"

[features]
default = []

[lib]
name = "avenix"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "ecs_tests"
path = "tests/ecs_tests.rs"

